<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColorChat - Vibrant Community</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%236366f1'/><text x='32' y='43' font-size='32' text-anchor='middle' fill='white'>💬</text></svg>" />
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #ec4899;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* TWO-STEP AUTH OVERLAY */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }

    .auth-card {
      background: #ffffff;
      color: #1e293b;
      width: 100%;
      max-width: 390px;
      padding: 2rem;
      border-radius: 18px;
      box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.25);
    }

    .auth-card h2 {
      margin: 0 0 0.4rem 0;
      font-size: 1.45rem;
    }

    .auth-card p {
      margin: 0 0 1.25rem 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .auth-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #334155;
    }

    .auth-card input {
      width: 100%;
      padding: 0.72rem 0.9rem;
      margin-bottom: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
    }

    .auth-card input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .auth-btn {
      width: 100%;
      padding: 0.78rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-btn:hover {
      opacity: 0.92;
    }

    .auth-error {
      color: #ef4444 !important;
      font-size: 0.88rem !important;
      margin-top: 0.75rem !important;
      margin-bottom: 0 !important;
      font-weight: 600;
    }

    /* HEADER */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .user-pill {
      background: #eef2ff;
      color: var(--primary-dark);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 3rem 1.25rem 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.3rem;
      margin: 0 0 0.75rem 0;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 1.5rem 0;
    }

    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* CHAT ROOM */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
    }

    .chat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: #fafafa;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .chat-header-title h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .badge {
      background: #dcfce7;
      color: #166534;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .chat-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .messages-box {
      height: 360px;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: #ffffff;
    }

    .msg {
      max-width: 78%;
      padding: 0.65rem 0.95rem;
      border-radius: 14px;
      background: #f1f5f9;
      align-self: flex-start;
      word-wrap: break-word;
    }

    .msg.mine {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      align-self: flex-end;
    }

    .msg-meta {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      opacity: 0.85;
    }

    .msg-text {
      font-size: 0.96rem;
    }

    .chat-form {
      display: flex;
      gap: 0.6rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      background: #fafafa;
    }

    .chat-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
    }

    .chat-form input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .tip-bar {
      padding: 0.75rem 1.25rem;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.88rem;
      border-top: 1px solid #e0e7ff;
    }

    /* ABOUT & FEATURES */
    .info-section {
      margin-top: 3rem;
      text-align: center;
    }

    .info-section h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    .info-section > p {
      color: var(--muted);
      max-width: 620px;
      margin: 0 auto 2rem;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      text-align: left;
    }

    .feature-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem;
    }

    .feature-card h3 {
      margin: 0 0 0.4rem 0;
      font-size: 1.1rem;
    }

    .feature-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.88rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <!-- TWO-STEP ACCESS & ACCOUNT OVERLAY -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">

      <!-- STEP 1: Site Passcode -->
      <div id="step-passcode">
        <h2>🔒 ColorChat Access</h2>
        <p>Enter the passcode to unlock ColorChat.</p>
        <form id="passcode-form">
          <label for="site-passcode">Passcode</label>
          <input type="password" id="site-passcode" placeholder="Enter passcode..." required />
          <button type="submit" class="auth-btn">Continue</button>
        </form>
        <p id="passcode-error" class="auth-error"></p>
      </div>

      <!-- STEP 2: Create Account -->
      <div id="step-register" style="display: none;">
        <h2>🎨 Create Your Account</h2>
        <p>Enter your email, create a password, and choose a display name.</p>
        <form id="register-form">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />

          <label for="reg-password">Create Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" minlength="4" required />

          <label for="reg-name">Display Name</label>
          <input type="text" id="reg-name" placeholder="Choose your chat name" maxlength="24" required />

          <button type="submit" class="auth-btn">Enter ColorChat</button>
        </form>
      </div>

    </div>
  </div>

  <!-- HEADER -->
  <header>
    <a href="#" class="brand">ColorChat</a>
    <nav>
      <a href="#live-chat">Live Chat</a>
      <a href="#about">About</a>
      <a href="#features">Features</a>
    </nav>
    <div class="header-actions">
      <span id="current-user-badge" class="user-pill" style="display: none;"></span>
      <button id="notif-btn" class="btn-outline" type="button">🔕 Turn On Notifications</button>
